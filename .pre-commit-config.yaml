# Local setup (once):
#   pip install pre-commit
#   pre-commit install --install-hooks      # installs the pre-commit, commit-msg and pre-push hooks
# Run everything by hand:
#   pre-commit run --all-files
#
# The same file drives CI (.github/workflows/pre-commit.yml), so a hook that
# passes here passes there. The gitleaks hook only scans staged changes; CI
# also scans the full history in its own job. Hooks for files this repo does
# not have yet (for example compose or workflow linters) are added in the change that
# introduces those files: a hook with nothing to check reports a false green.
minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit, commit-msg, pre-push]

# Alembic scaffolding and generated revisions: never reformat. Matches the
# migrations exclusion in pyproject.toml and CI's flake8 step (pre-commit
# passes file names explicitly, which would bypass those tool-level excludes).
exclude: ^migrations/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: detect-private-key
      - id: debug-statements
      - id: check-added-large-files
        args: ["--maxkb=2000"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # Python. Versions match what CI's lint job installs; settings come from
  # pyproject.toml (black, isort) and the flags below (flake8, bandit).
  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/isort
    rev: 8.0.1
    hooks:
      - id: isort

  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args: ["--max-line-length=120"]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-ll"]
        files: ^src/

  # Markdown, YAML and JSON. Reads .prettierrc.json (proseWrap: never).
  # v3.1.0 is not idempotent on YAML folded scalars (`key: >-`): it adds a
  # blank line on every run. Write multi-word values as one-line strings.
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [markdown, yaml, json]

  # Commit messages: Conventional Commits, matching this repo's history.
  # Merge, fixup and squash commits are allowed by the hook itself.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          [
            feat,
            fix,
            docs,
            style,
            refactor,
            perf,
            test,
            build,
            ci,
            chore,
            revert,
          ]

  # Slow, needs Redis on localhost:6379 (DB 15): so pre-push only, never on
  # every commit. CI runs the suite in the CI workflow, not here.
  - repo: local
    hooks:
      - id: pytest
        name: pytest (SQLite)
        entry: python -m pytest tests -q -x -p no:warnings
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
