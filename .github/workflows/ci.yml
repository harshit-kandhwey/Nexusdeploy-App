name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - run: pip install flake8 black isort bandit pip-audit
      - run: black --check .
      - run: isort --check .
      - run: flake8 . --max-line-length=120 --exclude=migrations/
      - name: bandit (non-blocking, visibility only)
        run: bandit -r src/ -ll
        continue-on-error: true
      - name: pip-audit (non-blocking, visibility only)
        run: pip-audit --requirement requirements.txt --desc
        continue-on-error: true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: nexusdeploy_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Run tests with coverage
        env:
          # TEST_DATABASE_URL, not DATABASE_URL: TestingConfig ignores DATABASE_URL by design,
          # so the suite runs on the Postgres service below and never on a real database.
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexusdeploy_test
          REDIS_URL: redis://localhost:6379/15
          SECRET_KEY: test-secret-key
          JWT_SECRET_KEY: test-jwt-secret-key-minimum-32-bytes!!
          ENV: testing
        run: pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=85

  docker-build:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: Dockerfile
          - image: worker
            dockerfile: Dockerfile.worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -f ${{ matrix.dockerfile }} -t nexusdeploy-${{ matrix.image }}:ci .

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, test, docker-build]
    steps:
      - name: Fail if any required job failed
        run: |
          echo '${{ toJSON(needs) }}'
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then exit 1; fi
